name: Upstream rebase self-test

# Tests the checker the nightly upstream rebase relies on. edera/4.22 is
# force-pushed whenever verify-upstream-rebase.sh says a rebase is clean, so a
# change that weakens it must not merge quietly. The suite builds a throwaway
# repository and confirms that honest replays pass and that edited, dropped,
# added and merged commits and a stale base are all refused.
#
# It runs only when the rebase machinery itself changes.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: ['edera/**']
    paths:
      - '.github/scripts/verify-upstream-rebase.sh'
      - '.github/scripts/tests/verify-upstream-rebase.test.sh'
      - '.github/workflows/upstream-rebase*.yml'
      - '.automation/**'

permissions:
  contents: read

concurrency:
  group: upstream-rebase-selftest-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checker tests
        run: bash .github/scripts/tests/verify-upstream-rebase.test.sh

      - name: Shellcheck
        run: |
          shellcheck .github/scripts/verify-upstream-rebase.sh \
                     .github/scripts/tests/verify-upstream-rebase.test.sh
