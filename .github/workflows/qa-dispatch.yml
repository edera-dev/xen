name: QA dispatch

# Hands each pull request to the QA runner in edera-dev/xen-qa, which builds
# and boots the change and reports the result back as the `xen-qa` commit
# status. Advisory, and not a required check.
#
# Only pull requests from branches in this repository are handed over, since
# fork pull requests get no id-token. The token that sends the
# repository_dispatch comes from Octo STS, under the xen-qa-dispatch trust
# policy in edera-dev/xen-qa, and lives only for this job.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: ['edera/**']

permissions:
  contents: read
  id-token: write

concurrency:
  group: qa-dispatch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Get a token for edera-dev/xen-qa
        id: sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: edera-dev/xen-qa
          identity: xen-qa-dispatch

      - name: Dispatch
        env:
          GH_TOKEN: ${{ steps.sts.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          gh api repos/edera-dev/xen-qa/dispatches \
            -f event_type=xen-pr \
            -f "client_payload[pr]=$PR" \
            -f "client_payload[head]=$HEAD" \
            -f "client_payload[base]=$BASE"
