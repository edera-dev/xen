name: Build

# Builds the hypervisor on every pull request and push to an edera/** branch,
# with the configs Edera ships from edera-dev/xen-oci:
#
#   - x86_64: the amd64 config;
#   - arm64: the arm64 config, which leaves PCI support out. x86 always has
#     PCI support, so code that compiles only with CONFIG_HAS_PCI breaks
#     this build alone;
#   - arm64-vpci: the arm64 config with PCI passthrough, which brings in the
#     downstream vPCI stack;
#   - arm64-debug: the arm64 config with DEBUG and UBSAN, less UBSAN's
#     alignment check, so that ASSERTs and the checks for undefined
#     behaviour are compiled in.
#
# Then it boots the arm64 build, with a busybox dom0, on emulated machines
# with the platform of each Graviton generation, which describe themselves
# only through UEFI and ACPI.
#
# It has no path filter, so it can be made a required check.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: ['edera/**']
  push:
    branches: ['edera/**']

permissions:
  contents: read

# A newer push to a pull request replaces its older build, but every commit
# pushed to a branch gets its own: sharing a group would let a third merge
# cancel the second one's pending build.
concurrency:
  group: build-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # arch is Xen's name for the architecture and config is xen-oci's,
        # which follows Docker's.
        include:
          - name: x86_64
            arch: x86_64
            config: amd64
          - name: arm64
            arch: arm64
            config: arm64
            cross: aarch64-linux-gnu-
          - name: arm64-vpci
            arch: arm64
            config: arm64
            cross: aarch64-linux-gnu-
            pci: true
          - name: arm64-debug
            arch: arm64
            config: arm64
            cross: aarch64-linux-gnu-
            debug: true
    name: build (${{ matrix.name }})
    # make reads both from the environment.
    env:
      XEN_TARGET_ARCH: ${{ matrix.arch }}
      CROSS_COMPILE: ${{ matrix.cross }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout the shipped config
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: edera-dev/xen-oci
          path: .xen-oci
          sparse-checkout: configs
          persist-credentials: false

      - name: Install toolchain
        run: |
          set -euo pipefail
          packages=(build-essential bison flex python3)
          # Debian names a cross compiler package after its target triplet.
          if [ -n "$CROSS_COMPILE" ]; then
            packages+=("gcc-${CROSS_COMPILE%-}")
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"

      - name: Configure
        env:
          CONFIG: ${{ matrix.config }}
          PCI: ${{ matrix.pci }}
          DEBUG: ${{ matrix.debug }}
        run: |
          set -euo pipefail
          # xen-oci keeps one config per major.minor release.
          XEN_VER="$(make -s -C xen xenversion | cut -d. -f1,2)"
          SHIPPED_CONFIG=".xen-oci/configs/$XEN_VER/$CONFIG.defconfig"
          cp "$SHIPPED_CONFIG" xen/.config
          make -C xen olddefconfig
          # The same check xen-oci makes before it ships, so this builds what ships.
          missing="$(grep -vxFf xen/.config "$SHIPPED_CONFIG" || true)"
          if [ -n "$missing" ]; then
            echo "::error::olddefconfig dropped or changed these settings:"
            echo "$missing"
            exit 1
          fi
          if [ "$PCI" = "true" ]; then
            xen/scripts/config --file xen/.config --enable EXPERT --enable PCI_PASSTHROUGH
            make -C xen olddefconfig
          fi
          if [ "$DEBUG" = "true" ]; then
            xen/scripts/config --file xen/.config --enable DEBUG --enable UBSAN
            make -C xen olddefconfig
          fi

      - name: Build
        env:
          DEBUG: ${{ matrix.debug }}
        run: |
          set -euo pipefail
          if [ "$DEBUG" = "true" ]; then
            # ACPICA reads the XSDT's 64-bit entries where they are only
            # 4-byte aligned, as it does on purpose on any 64-bit target that
            # handles misaligned loads. arm64 does, so leave UBSAN's alignment
            # check out, as Linux does on arm64.
            make -C xen -j"$(nproc)" \
              CFLAGS_UBSAN="-fsanitize=undefined -fno-sanitize=alignment"
          else
            make -C xen -j"$(nproc)"
          fi

      - name: Upload the hypervisor to boot
        if: matrix.name == 'arm64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xen-${{ matrix.name }}
          path: xen/xen
          if-no-files-found: error
          retention-days: 7

  boot:
    needs: build
    # Boot even when another configuration fails to build. Without the arm64
    # build, downloading it fails instead.
    if: ${{ !cancelled() }}
    # An arm64 runner, so that its own package is an aarch64 busybox. QEMU
    # emulates the CPU all the same: Xen needs EL2, and no hosted runner
    # gives a guest EL2.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # machine names a file in .github/boot/machines, and cases a
        # directory in .github/boot/cases, whose cases the job boots in turn.
        include:
          - machine: graviton3
          - machine: graviton4
          - machine: graviton4-numa
          - machine: graviton4
            cases: dom0-mem-default
    name: boot (arm64, ${{ matrix.machine }}${{ matrix.cases && format(', {0}', matrix.cases) || '' }})
    env:
      # An arm64 host kernel that protect has shipped, pinned so that a boot
      # does not change when protect moves to a newer one.
      DOM0_KERNEL: ghcr.io/edera-dev/host-kernel:6.18@sha256:c6f067e91b94e2dcc6cda29dce718787ba197d31b59be26c036f11f389a04afe
      MACHINE: ${{ matrix.machine }}
      CASES: ${{ matrix.cases }}
      # How long run-arm64.sh lets one boot take. A job may boot several
      # cases in turn, so timeout-minutes has to leave room for all of them.
      TIMEOUT: 180
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download the hypervisor
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xen-arm64
          path: ${{ runner.temp }}/xen

      - name: Install QEMU and busybox
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-arm qemu-efi-aarch64 busybox-static cpio

      - name: Fetch the dom0 kernel
        run: |
          set -euo pipefail
          # The image has no command to run; docker create needs one anyway.
          id=$(docker create --platform linux/arm64 "$DOM0_KERNEL" /none)
          docker cp "$id:/kernel/image" "$RUNNER_TEMP/Image"
          docker rm "$id" >/dev/null

      - name: Boot
        run: |
          set -uo pipefail
          boot() {
            bash .github/boot/run-arm64.sh --xen "$RUNNER_TEMP/xen/xen" \
              --kernel "$RUNNER_TEMP/Image" --busybox /usr/bin/busybox \
              --machine "$MACHINE" "$@"
          }
          if [ -z "$CASES" ]; then
            boot --out "$RUNNER_TEMP/boot/$MACHINE"
            exit
          fi
          # Every case boots, even after one fails.
          failed=''
          for file in .github/boot/cases/"$CASES"/*.sh; do
            case=$CASES/$(basename "$file" .sh)
            echo "::group::$case"
            boot --case "$case" --out "$RUNNER_TEMP/boot/$case" ||
              failed="$failed $case"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::failed:$failed"
            exit 1
          fi

      - name: Upload the console log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boot-arm64-${{ matrix.machine }}${{ matrix.cases && format('-{0}', matrix.cases) || '' }}
          path: ${{ runner.temp }}/boot/**/serial.log
          retention-days: 30
